name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Rack ${{ matrix.rack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]
        rack: ["2", "3"]
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rack_${{ matrix.rack }}.gemfile
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # Block scalar on purpose: in a plain `run:` value a " #" starts a YAML
      # comment, which truncated this line at the interpolation and broke the
      # shell quoting.
      - name: Report resolved versions
        run: |
          bundle exec ruby -e 'require "rack"; puts "Ruby #{RUBY_VERSION}, Rack #{Rack.release}"'

      - name: Run specs
        run: bundle exec rspec
